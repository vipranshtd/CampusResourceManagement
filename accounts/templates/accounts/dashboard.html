
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Campus Resources</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">Campus Resource Management</span>
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
    </form>
</nav>

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2>Welcome, {{ request.user.first_name }}!</h2>
            <p class="text-muted">You are successfully logged in.</p>
            <p><strong>Username:</strong> {{ request.user.username }}</p>
            <p><strong>Email:</strong> {{ request.user.email }}</p>
            <p><strong>Role:</strong> {{ request.user.profile.get_role_display }}</p>
        </div>
    </div>
</div>
</body>
</html>
