
{% extends "admin/base.html" %}

{% block title %}Campus Resource Management | Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">Campus Resource Management</a>
</h1>
{% endblock %}

{% block nav-global %}
<div class="crm-admin-nav">
    <a href="{% url 'dashboard' %}" class="crm-nav-button">
        ← Back to Dashboard
    </a>
    <a href="{% url 'home' %}" class="crm-nav-link">
        View Website ↗
    </a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    :root {
        --primary: #1e3a5f;
        --secondary: #2563eb;
        --accent: #2563eb;
        --primary-fg: #fff;
    }

    #header {
        background: #14213d;
        color: #fff;
        padding: 14px 24px;
    }

    #site-name a {
        color: #fff !important;
        font-weight: 700;
        font-size: 20px;
    }

    .crm-admin-nav {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 12px;
        flex-wrap: wrap;
    }

    .crm-nav-button {
        display: inline-block;
        background: #2563eb;
        color: white !important;
        padding: 9px 16px;
        border-radius: 7px;
        font-weight: 600;
        text-decoration: none !important;
        transition: background 0.2s;
    }

    .crm-nav-button:hover {
        background: #1d4ed8;
    }

    .crm-nav-link {
        color: #dbeafe !important;
        text-decoration: none !important;
        font-weight: 500;
    }

    .crm-nav-link:hover {
        color: white !important;
    }

    div.breadcrumbs {
        background: #eaf1fb;
        color: #1e3a5f;
        padding: 12px 24px;
    }

    div.breadcrumbs a {
        color: #1d4ed8;
    }

    .module h2,
    .module caption,
    .inline-group h2 {
        background: #1e3a5f;
    }

    .button,
    input[type=submit],
    input[type=button],
    .submit-row input,
    a.button {
        border-radius: 6px;
    }

    #content {
        padding: 24px;
    }

    @media (max-width: 600px) {
        #header {
            padding: 12px 16px;
        }

        #content {
            padding: 16px;
        }
    }
</style>
{% endblock %}
