
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Resource Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">Campus Resource Management</a>

            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'resource_catalog' %}">Resources</a>
                <a class="nav-link" href="{% url 'my_bookings' %}">My Bookings</a>
                <a class="nav-link" href="{% url 'manage_bookings' %}">Manage Bookings</a>
                <a class="nav-link" href="{% url 'maintenance_list' %}">Maintenance</a>
            </div>

        </div>
    </nav>

    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="container mt-4">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
